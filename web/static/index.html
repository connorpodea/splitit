<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>float</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{
  --bg:#f5f4f0;
  --white:#ffffff;
  --border:#e2e0d8;
  --text:#1a1a18;
  --muted:#8a8880;
  --accent:#1a1a18;
  --green:#16a34a;
  --green-bg:#f0fdf4;
  --yellow:#d97706;
  --yellow-bg:#fffbeb;
  --red:#dc2626;
  --pill-bg:#f0ede6;
}

body{
  background:var(--bg);
  color:var(--text);
  font-family:'Georgia',serif;
  font-size:15px;
  min-height:100vh;
}

/* ── layout ── */
.shell{max-width:420px;margin:0 auto;min-height:100vh;background:var(--white);border-left:1px solid var(--border);border-right:1px solid var(--border)}

/* ── topbar ── */
.topbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:16px 20px;
  border-bottom:1px solid var(--border);
  position:sticky;top:0;background:var(--white);z-index:10;
}
.wordmark{font-size:22px;font-style:italic;letter-spacing:-0.03em}
.topbar-actions{display:flex;gap:8px}

/* ── tabs ── */
.tabs{display:flex;border-bottom:1px solid var(--border)}
.tab{
  flex:1;padding:12px;text-align:center;
  font-size:13px;cursor:pointer;color:var(--muted);
  border-bottom:2px solid transparent;
  transition:all .15s;
}
.tab.active{color:var(--text);border-bottom-color:var(--text)}

/* ── sections ── */
.section{display:none;padding:16px 20px}
.section.active{display:block}

/* ── send form ── */
.send-card{background:var(--bg);border-radius:12px;padding:20px;margin-bottom:20px}
.field-label{font-size:12px;color:var(--muted);margin-bottom:4px;display:block}
.field{margin-bottom:14px}
input[type=text],input[type=number],select{
  width:100%;
  background:var(--white);
  border:1px solid var(--border);
  border-radius:8px;
  padding:10px 12px;
  font-family:inherit;
  font-size:14px;
  color:var(--text);
  outline:none;
  transition:border .15s;
}
input:focus,select:focus{border-color:var(--text)}

.method-toggle{display:flex;gap:8px;margin-bottom:14px}
.method-btn{
  flex:1;padding:10px;border:1px solid var(--border);border-radius:8px;
  background:var(--white);cursor:pointer;font-family:inherit;font-size:13px;
  color:var(--muted);transition:all .15s;text-align:center;
}
.method-btn.active{
  border-color:var(--text);background:var(--text);color:var(--white);
}

.bnpl-options{
  display:none;
  background:var(--yellow-bg);
  border:1px solid #fde68a;
  border-radius:8px;
  padding:12px 14px;
  margin-bottom:14px;
  font-size:13px;
}
.bnpl-options.show{display:block}
.bnpl-options select{background:var(--white)}

.fee-line{
  font-size:12px;color:var(--yellow);margin-top:8px;
}

.btn-send{
  width:100%;padding:12px;
  background:var(--text);color:var(--white);
  border:none;border-radius:8px;
  font-family:inherit;font-size:15px;
  cursor:pointer;transition:opacity .15s;
}
.btn-send:hover{opacity:.85}

/* ── feed ── */
.feed-empty{color:var(--muted);font-size:14px;padding:20px 0}

.feed-item{
  display:flex;align-items:flex-start;gap:12px;
  padding:14px 0;
  border-bottom:1px solid var(--border);
}
.feed-item:last-child{border-bottom:none}

.avatar{
  width:40px;height:40px;border-radius:50%;
  background:var(--pill-bg);
  display:flex;align-items:center;justify-content:center;
  font-size:16px;flex-shrink:0;
  border:1px solid var(--border);
}
.feed-body{flex:1;min-width:0}
.feed-who{font-size:14px;font-weight:bold}
.feed-note{font-size:13px;color:var(--muted);margin:2px 0 6px}
.feed-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.feed-amount{font-size:14px;font-weight:bold}

.tag{
  display:inline-block;padding:2px 8px;border-radius:20px;
  font-size:11px;font-family:monospace;
}
.tag.instant{background:var(--green-bg);color:var(--green)}
.tag.bnpl{background:var(--yellow-bg);color:var(--yellow)}
.tag.settled{background:var(--green-bg);color:var(--green)}

/* ── plans ── */
.plan-card{
  border:1px solid var(--border);border-radius:10px;
  padding:16px;margin-bottom:12px;
}
.plan-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px}
.plan-title{font-size:14px;font-weight:bold}
.plan-sub{font-size:12px;color:var(--muted);margin-top:2px}
.progress-bar{height:4px;background:var(--border);border-radius:2px;margin-bottom:12px}
.progress-fill{height:100%;background:var(--green);border-radius:2px;transition:width .3s}
.installment-row{
  display:flex;justify-content:space-between;align-items:center;
  padding:8px 0;border-bottom:1px solid var(--border);font-size:13px;
}
.installment-row:last-child{border-bottom:none}
.pay-btn{
  padding:4px 12px;border:1px solid var(--text);border-radius:20px;
  background:none;cursor:pointer;font-family:inherit;font-size:12px;
  transition:all .15s;
}
.pay-btn:hover{background:var(--text);color:var(--white)}
.paid-check{color:var(--green);font-size:13px}

/* ── users tab ── */
.user-form{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.user-form input{flex:1;min-width:120px}
.btn-sm{
  padding:9px 14px;background:var(--text);color:var(--white);
  border:none;border-radius:8px;cursor:pointer;
  font-family:inherit;font-size:13px;white-space:nowrap;
}
.user-row{
  display:flex;align-items:center;gap:10px;
  padding:10px 0;border-bottom:1px solid var(--border);font-size:13px;
}
.user-row .avatar{width:32px;height:32px;font-size:13px}
.user-name{font-weight:bold}
.user-id{color:var(--muted);font-size:12px}

/* ── toast ── */
.toast{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);
  background:var(--text);color:var(--white);
  padding:10px 18px;border-radius:8px;font-size:13px;
  opacity:0;transition:all .25s;pointer-events:none;white-space:nowrap;
  z-index:100;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div class="shell">

  <div class="topbar">
    <span class="wordmark">float</span>
    <span style="font-size:12px;color:var(--muted)">pay later. they get it now.</span>
  </div>

  <div class="tabs">
    <div class="tab active" onclick="switchTab('send',this)">Send</div>
    <div class="tab" onclick="switchTab('feed',this)">Activity</div>
    <div class="tab" onclick="switchTab('plans',this)">My Plans</div>
    <div class="tab" onclick="switchTab('users',this)">People</div>
  </div>

  <!-- SEND -->
  <div class="section active" id="tab-send">
    <div class="send-card">
      <div class="field">
        <label class="field-label">You are</label>
        <select id="send-from"></select>
      </div>
      <div class="field">
        <label class="field-label">Paying</label>
        <select id="send-to"></select>
      </div>
      <div class="field">
        <label class="field-label">Amount ($)</label>
        <input id="send-amount" type="number" placeholder="0.00" min="1" step="0.01" oninput="updateFee()"/>
      </div>
      <div class="field">
        <label class="field-label">Note</label>
        <input id="send-note" type="text" placeholder="dinner, rent, concert tickets..."/>
      </div>

      <label class="field-label" style="margin-bottom:8px">How are you paying?</label>
      <div class="method-toggle">
        <div class="method-btn active" id="btn-instant" onclick="setMethod('instant')">
          Pay now
        </div>
        <div class="method-btn" id="btn-bnpl" onclick="setMethod('bnpl')">
          Pay over time ✦
        </div>
      </div>

      <div class="bnpl-options" id="bnpl-options">
        <label class="field-label">Split into</label>
        <select id="installments" onchange="updateFee()">
          <option value="2">2 payments · every 2 weeks</option>
          <option value="3">3 payments · every 2 weeks</option>
          <option value="4" selected>4 payments · every 2 weeks</option>
        </select>
        <div class="fee-line" id="fee-line">5% fee · they get the money now</div>
      </div>

      <button class="btn-send" onclick="sendPayment()">Send</button>
    </div>
  </div>

  <!-- FEED -->
  <div class="section" id="tab-feed">
    <div id="feed-list"><p class="feed-empty">No payments yet.</p></div>
  </div>

  <!-- PLANS -->
  <div class="section" id="tab-plans">
    <div id="plans-list"><p class="feed-empty">No active plans.</p></div>
  </div>

  <!-- USERS / PEOPLE -->
  <div class="section" id="tab-users">
    <div class="user-form">
      <input id="new-name" placeholder="name"/>
      <input id="new-email" placeholder="email"/>
      <button class="btn-sm" onclick="addUser()">Add</button>
    </div>
    <div id="users-list"></div>
  </div>

</div>

<div class="toast" id="toast"></div>

<script>
// ──────────────────────────────────────────────
// State
// ──────────────────────────────────────────────
let method = 'instant';
let currentUserID = null; // who is "logged in" — just whichever sender is selected

// ──────────────────────────────────────────────
// Tabs
// ──────────────────────────────────────────────
function switchTab(name, el) {
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.getElementById('tab-' + name).classList.add('active');
  el.classList.add('active');
  if (name === 'feed')  loadFeed();
  if (name === 'plans') loadPlans();
  if (name === 'users') loadUsers();
  if (name === 'send')  loadUserSelects();
}

// ──────────────────────────────────────────────
// API helpers
// ──────────────────────────────────────────────
const api = async (method, path, body) => {
  const res = await fetch(path, {
    method,
    headers: {'Content-Type':'application/json'},
    body: body ? JSON.stringify(body) : undefined,
  });
  const text = await res.text();
  try { const j = JSON.parse(text); if (!res.ok) throw new Error(j || text); return j; }
  catch(e) { if (!res.ok) throw e; return text; }
};

// ──────────────────────────────────────────────
// Send
// ──────────────────────────────────────────────
function setMethod(m) {
  method = m;
  document.getElementById('btn-instant').classList.toggle('active', m === 'instant');
  document.getElementById('btn-bnpl').classList.toggle('active', m === 'bnpl');
  document.getElementById('bnpl-options').classList.toggle('show', m === 'bnpl');
  updateFee();
}

function updateFee() {
  const amt = parseFloat(document.getElementById('send-amount').value) || 0;
  const n = parseInt(document.getElementById('installments').value);
  const fee = (amt * 0.05).toFixed(2);
  const per = ((amt + parseFloat(fee)) / n).toFixed(2);
  document.getElementById('fee-line').textContent =
    amt > 0
      ? `5% fee = $${fee} · you pay $${per} × ${n} · they get $${amt.toFixed(2)} now`
      : '5% fee · they get the money now';
}

async function sendPayment() {
  const fromID = document.getElementById('send-from').value;
  const toID   = document.getElementById('send-to').value;
  const amount = parseFloat(document.getElementById('send-amount').value);
  const note   = document.getElementById('send-note').value;
  const n      = parseInt(document.getElementById('installments').value);

  if (!fromID || !toID) { toast('Pick a sender and receiver'); return; }
  if (fromID === toID)  { toast('You can\'t pay yourself'); return; }
  if (!amount || amount <= 0) { toast('Enter an amount'); return; }

  const id = 'p' + Date.now();
  try {
    const body = { id, sender_id: fromID, receiver_id: toID, amount, note, method };
    if (method === 'bnpl') body.installments = n;
    await api('POST', '/api/payments', body);

    // clear form
    document.getElementById('send-amount').value = '';
    document.getElementById('send-note').value = '';
    setMethod('instant');

    toast(method === 'bnpl' ? `$${amount} sent! Pay in ${n} installments.` : `$${amount} sent!`);
    loadUserSelects();
  } catch(e) {
    toast(e.message || 'Something went wrong', true);
  }
}

// ──────────────────────────────────────────────
// Feed
// ──────────────────────────────────────────────
async function loadFeed() {
  const [payments, users] = await Promise.all([
    api('GET', '/api/payments'),
    api('GET', '/api/users'),
  ]);
  const userMap = {};
  (users || []).forEach(u => userMap[u.id] = u);

  const el = document.getElementById('feed-list');
  if (!payments || !payments.length) {
    el.innerHTML = '<p class="feed-empty">No payments yet.</p>';
    return;
  }

  // newest first
  const sorted = [...payments].sort((a,b) => new Date(b.created_at) - new Date(a.created_at));

  el.innerHTML = sorted.map(p => {
    const sender   = userMap[p.sender_id]   || {name: p.sender_id};
    const receiver = userMap[p.receiver_id] || {name: p.receiver_id};
    const isBNPL   = p.method === 'bnpl';
    const emoji    = initials(sender.name);
    return `
      <div class="feed-item">
        <div class="avatar">${emoji}</div>
        <div class="feed-body">
          <div class="feed-who">${sender.name} → ${receiver.name}</div>
          <div class="feed-note">${p.note || '—'}</div>
          <div class="feed-meta">
            <span class="feed-amount">$${p.amount.toFixed(2)}</span>
            <span class="tag ${isBNPL ? 'bnpl' : 'instant'}">${isBNPL ? 'pay later' : 'instant'}</span>
            <span class="tag settled">${p.status}</span>
          </div>
        </div>
      </div>`;
  }).join('');
}

// ──────────────────────────────────────────────
// Plans
// ──────────────────────────────────────────────
async function loadPlans() {
  const senderID = document.getElementById('send-from')?.value;
  const url = senderID ? `/api/plans?user_id=${senderID}` : '/api/plans';

  const [plans, users, payments] = await Promise.all([
    api('GET', url),
    api('GET', '/api/users'),
    api('GET', '/api/payments'),
  ]);

  const userMap = {}, payMap = {};
  (users || []).forEach(u => userMap[u.id] = u);
  (payments || []).forEach(p => payMap[p.id] = p);

  const el = document.getElementById('plans-list');
  if (!plans || !plans.length) {
    el.innerHTML = '<p class="feed-empty">No active plans.</p>';
    return;
  }

  // fetch installments for each plan
  const withSchedules = await Promise.all(plans.map(async plan => {
    const schedule = await api('GET', `/api/plans/${plan.id}/installments`);
    return { plan, schedule: schedule || [] };
  }));

  el.innerHTML = withSchedules.map(({ plan, schedule }) => {
    const payment  = payMap[plan.payment_id] || {};
    const receiver = userMap[payment.receiver_id] || { name: payment.receiver_id || '?' };
    const paid     = schedule.filter(i => i.status === 'paid').length;
    const pct      = Math.round((paid / plan.installments) * 100);

    const rows = schedule.map(inst => {
      const due = new Date(inst.due_date).toLocaleDateString('en-US',{month:'short',day:'numeric'});
      if (inst.status === 'paid') {
        return `<div class="installment-row">
          <span>#${inst.number} · $${inst.amount.toFixed(2)}</span>
          <span><span class="paid-check">✓ paid</span></span>
        </div>`;
      }
      return `<div class="installment-row">
        <span>#${inst.number} · $${inst.amount.toFixed(2)} · due ${due}</span>
        <button class="pay-btn" onclick="payInstallment('${plan.id}',${inst.number})">Pay</button>
      </div>`;
    }).join('');

    const statusTag = plan.status === 'completed'
      ? '<span class="tag settled">completed</span>'
      : `<span class="tag bnpl">${paid}/${plan.installments} paid</span>`;

    return `<div class="plan-card">
      <div class="plan-header">
        <div>
          <div class="plan-title">$${plan.principal.toFixed(2)} to ${receiver.name}</div>
          <div class="plan-sub">+$${plan.fee.toFixed(2)} fee · $${plan.total.toFixed(2)} total</div>
        </div>
        ${statusTag}
      </div>
      <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
      ${rows}
    </div>`;
  }).join('');
}

async function payInstallment(planID, number) {
  try {
    const res = await api('POST', `/api/pay/${planID}/${number}`);
    if (res.plan_completed) toast('🎉 Plan fully paid off!');
    else toast(`Payment #${number} paid`);
    loadPlans();
  } catch(e) {
    toast(e.message, true);
  }
}

// ──────────────────────────────────────────────
// Users
// ──────────────────────────────────────────────
async function loadUsers() {
  const users = await api('GET', '/api/users');
  const el = document.getElementById('users-list');
  if (!users || !users.length) {
    el.innerHTML = '<p class="feed-empty">No users yet. Add some above.</p>';
    return;
  }
  el.innerHTML = users.map(u => `
    <div class="user-row">
      <div class="avatar">${initials(u.name)}</div>
      <div>
        <div class="user-name">${u.name}</div>
        <div class="user-id">${u.id} · ${u.email}</div>
      </div>
    </div>`).join('');
  loadUserSelects();
}

async function addUser() {
  const name  = document.getElementById('new-name').value.trim();
  const email = document.getElementById('new-email').value.trim();
  if (!name || !email) { toast('Name and email required'); return; }

  const id = name.toLowerCase().replace(/\s+/g, '_') + '_' + Date.now().toString(36);
  try {
    await api('POST', '/api/users', { id, name, email });
    document.getElementById('new-name').value  = '';
    document.getElementById('new-email').value = '';
    toast(`${name} added`);
    loadUsers();
  } catch(e) {
    toast(e.message, true);
  }
}

async function loadUserSelects() {
  const users = await api('GET', '/api/users');
  if (!users) return;
  const opts = users.map(u => `<option value="${u.id}">${u.name}</option>`).join('');
  ['send-from','send-to'].forEach(id => {
    const sel = document.getElementById(id);
    const prev = sel.value;
    sel.innerHTML = '<option value="">— select —</option>' + opts;
    if (prev) sel.value = prev;
  });
}

// ──────────────────────────────────────────────
// Helpers
// ──────────────────────────────────────────────
function initials(name) {
  if (!name) return '?';
  return name.split(' ').map(w => w[0]).join('').slice(0,2).toUpperCase();
}

let toastTimer;
function toast(msg, isErr=false) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.style.background = isErr ? '#dc2626' : 'var(--text)';
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2800);
}

// init
loadUserSelects();
</script>
</body>
</html>
